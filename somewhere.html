<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <title>Somewhere</title>
    <meta name="description" content="A place neither here nor there. Touch the void. Receive a truth and two lies. Do not guess wrong.">
    <meta property="og:title" content="Somewhere">
    <meta property="og:description" content="Neither here nor there. Touch the void. One truth. Two lies. Don't guess wrong.">
    <meta property="og:url" content="https://thefirstspark.shop/somewhere.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --void: #030308;
            --mist: rgba(180, 170, 220, 0.06);
            --truth: #a8f0d8;
            --lie: #c47a8a;
            --gold: #d4b87a;
            --dim: rgba(220, 215, 240, 0.45);
            --text: rgba(235, 230, 255, 0.88);
        }

        html { scroll-behavior: auto; }

        body {
            background: var(--void);
            color: var(--text);
            font-family: 'Cormorant Garamond', Georgia, serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        body.guessing { cursor: default; }
        body.wrong { animation: wrongFlash .6s ease; }
        @keyframes wrongFlash {
            0%, 100% { filter: none; }
            30% { filter: invert(.08) hue-rotate(40deg); }
            60% { filter: brightness(.4); }
        }

        #void-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .fog {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 100% 60% at 50% 100%, rgba(60, 40, 100, 0.15), transparent 70%),
                radial-gradient(ellipse 80% 40% at 20% 30%, rgba(30, 60, 90, 0.08), transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 60%, rgba(90, 50, 80, 0.06), transparent 55%);
        }

        .entry {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 28px;
        }

        .entry h1 {
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.12);
            margin-bottom: 24px;
            animation: breathe 8s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.5; letter-spacing: 0.08em; }
            50% { opacity: 0.85; letter-spacing: 0.14em; }
        }

        .entry .sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--dim);
            max-width: 340px;
            line-height: 2;
        }

        .entry .warn {
            margin-top: 48px;
            font-size: 1.05rem;
            font-style: italic;
            color: rgba(196, 122, 138, 0.7);
            max-width: 300px;
        }

        .scroll-glyph {
            margin-top: 72px;
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.15);
            animation: drift 3s ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(10px); opacity: 0.6; }
        }

        /* ─── THE ABYSS ─── */
        #abyss {
            position: relative;
            z-index: 2;
            min-height: 400vh;
            pointer-events: none;
        }

        #touch-zone {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: auto;
            cursor: crosshair;
        }

        .depth-marker {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.48rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.06);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .whisper {
            position: absolute;
            font-style: italic;
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            color: rgba(200, 190, 230, 0.18);
            max-width: 200px;
            line-height: 1.6;
            pointer-events: none;
            user-select: none;
            animation: whisperFade 12s ease-in-out infinite;
        }
        @keyframes whisperFade {
            0%, 100% { opacity: 0; }
            40%, 60% { opacity: 1; }
        }

        /* ─── ORACLE PANEL ─── */
        #oracle {
            position: fixed;
            z-index: 50;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            width: min(480px, calc(100vw - 40px));
            padding: 36px 32px 32px;
            background: rgba(8, 6, 18, 0.92);
            border: 1px solid rgba(168, 240, 216, 0.15);
            backdrop-filter: blur(24px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .45s ease, transform .45s ease;
        }
        #oracle.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        #oracle.wrong-state {
            border-color: rgba(196, 122, 138, 0.4);
        }

        .oracle-kicker {
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
            text-align: center;
        }

        .oracle-prompt {
            font-size: 1.15rem;
            font-style: italic;
            text-align: center;
            color: var(--dim);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice {
            display: block;
            width: 100%;
            text-align: left;
            padding: 18px 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text);
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.05rem;
            line-height: 1.55;
            cursor: pointer;
            transition: border-color .25s, background .25s, transform .2s;
        }
        .choice:hover:not(:disabled) {
            border-color: rgba(168, 240, 216, 0.35);
            background: rgba(168, 240, 216, 0.04);
            transform: translateX(4px);
        }
        .choice:disabled { cursor: default; opacity: 0.7; }
        .choice.correct {
            border-color: var(--truth);
            background: rgba(168, 240, 216, 0.08);
            color: var(--truth);
        }
        .choice.incorrect {
            border-color: var(--lie);
            background: rgba(196, 122, 138, 0.06);
            color: var(--lie);
            text-decoration: line-through;
            opacity: 0.45;
        }

        .oracle-close {
            display: block;
            margin: 24px auto 0;
            background: none;
            border: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.48rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            padding: 8px;
            transition: color .2s;
        }
        .oracle-close:hover { color: rgba(255,255,255,0.5); }

        .oracle-result {
            text-align: center;
            font-size: 1.2rem;
            font-style: italic;
            line-height: 1.7;
            display: none;
        }
        .oracle-result.show { display: block; }
        .oracle-result.good { color: var(--truth); }
        .oracle-result.bad { color: var(--lie); }

        /* ─── RIPPLE ON TOUCH ─── */
        .ripple {
            position: fixed;
            z-index: 4;
            width: 0;
            height: 0;
            border-radius: 50%;
            border: 1px solid rgba(168, 240, 216, 0.4);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleOut 1.2s ease-out forwards;
        }
        @keyframes rippleOut {
            to { width: 200px; height: 200px; opacity: 0; margin: -100px 0 0 -100px; }
        }

        /* ─── BOTTOM ─── */
        .floor {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 28px;
        }
        .floor p {
            font-size: 1.3rem;
            font-style: italic;
            color: rgba(255,255,255,0.2);
            max-width: 400px;
            line-height: 1.8;
        }
        .floor a {
            margin-top: 40px;
            font-family: 'Space Mono', monospace;
            font-size: 0.52rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(212, 184, 122, 0.4);
            text-decoration: none;
            transition: color .3s;
        }
        .floor a:hover { color: var(--gold); }

        .streak {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 40;
            font-family: 'Space Mono', monospace;
            font-size: 0.45rem;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.12);
            pointer-events: none;
        }

        @media (max-width: 480px) {
            #oracle { padding: 28px 20px 24px; }
            .choice { padding: 14px 16px; font-size: 0.98rem; }
        }
    </style>
</head>
<body>
    <canvas id="void-canvas" aria-hidden="true"></canvas>
    <div class="fog" aria-hidden="true"></div>

    <header class="entry">
        <h1>Somewhere</h1>
        <p class="sub">Neither here<br>nor there</p>
        <p class="warn">Touch the void below.<br>It will offer one truth and two lies.<br>Do not guess wrong.</p>
        <p class="scroll-glyph">descend ↓</p>
    </header>

    <section id="abyss" aria-label="The mystic void">
        <div id="touch-zone" aria-label="Touch the void"></div>
    </section>

    <footer class="floor">
        <p id="floor-text">You reached the floor of somewhere. Most people never do. The void remembers what you chose.</p>
        <a href="/">return to here</a>
    </footer>

    <div id="oracle" role="dialog" aria-modal="true" aria-labelledby="oracle-prompt">
        <div class="oracle-kicker" id="oracle-kicker">The void speaks</div>
        <p class="oracle-prompt" id="oracle-prompt">Three paths. One is real.</p>
        <div class="choices" id="choices"></div>
        <p class="oracle-result" id="oracle-result"></p>
        <button class="oracle-close" id="oracle-close" type="button">dissolve</button>
    </div>

    <div class="streak" id="streak" aria-live="polite"></div>

    <script>
    (function () {
        'use strict';

        /* ─── VOID PARTICLES ─── */
        var canvas = document.getElementById('void-canvas');
        var ctx = canvas.getContext('2d');
        var motes = [];
        var W, H, scrollY = 0;

        function resize() {
            W = canvas.width = innerWidth;
            H = canvas.height = innerHeight;
            var n = Math.min(180, Math.floor(W * H / 6000));
            motes = [];
            for (var i = 0; i < n; i++) {
                motes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.4 + 0.3,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: Math.random() * 0.25 + 0.05,
                    phase: Math.random() * Math.PI * 2,
                    hue: Math.random() < 0.3 ? 160 : (Math.random() < 0.5 ? 270 : 40)
                });
            }
        }

        function drawVoid() {
            scrollY = window.scrollY;
            ctx.fillStyle = 'rgba(3, 3, 8, 0.18)';
            ctx.fillRect(0, 0, W, H);

            motes.forEach(function (m) {
                m.x += m.vx + Math.sin(m.phase) * 0.08;
                m.y += m.vy + scrollY * 0.0003;
                m.phase += 0.012;

                if (m.x < -10) m.x = W + 10;
                if (m.x > W + 10) m.x = -10;
                if (m.y > H + 10) { m.y = -10; m.x = Math.random() * W; }

                var depth = 0.15 + 0.35 * (m.y / H);
                var alpha = depth * (0.4 + 0.6 * Math.sin(m.phase));
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
                if (m.hue === 160) ctx.fillStyle = 'rgba(168, 240, 216, ' + alpha + ')';
                else if (m.hue === 270) ctx.fillStyle = 'rgba(180, 140, 220, ' + alpha + ')';
                else ctx.fillStyle = 'rgba(212, 184, 122, ' + alpha + ')';
                ctx.fill();
            });

            requestAnimationFrame(drawVoid);
        }

        resize();
        drawVoid();
        window.addEventListener('resize', resize);

        /* ─── ABYSS DECOR ─── */
        var abyss = document.getElementById('abyss');
        var depths = [
            'shallow doubt', 'the almost', 'unmarked coordinates',
            'where maps end', 'the between', 'negative space',
            'the unsaid', 'liminal drift', 'soft gravity',
            'the other side of sleep', 'untranslated', 'the fold'
        ];
        var whispers = [
            'you have been here before',
            'this is not a test. yes it is.',
            'the lie wears your face',
            'truth has no temperature',
            'wrong answers echo',
            'somewhere is listening',
            'do not rush',
            'the void keeps score gently',
            'three doors. one opens.',
            'what you believe becomes terrain'
        ];

        depths.forEach(function (label, i) {
            var el = document.createElement('div');
            el.className = 'depth-marker';
            el.style.top = (12 + i * 7.5) + '%';
            el.textContent = '— ' + label + ' —';
            abyss.appendChild(el);
        });

        whispers.forEach(function (text, i) {
            var el = document.createElement('div');
            el.className = 'whisper';
            el.style.top = (8 + i * 9) + '%';
            el.style.left = (i % 2 === 0 ? 8 : 62) + '%';
            el.style.animationDelay = (i * 1.7) + 's';
            el.textContent = text;
            abyss.appendChild(el);
        });

        /* ─── ORACLE DATA ─── */
        var oracles = [
            {
                prompt: 'What lives in the space between two heartbeats?',
                truth: 'The only moment that is actually yours.',
                lies: ['A countdown you cannot hear.', 'Nothing. The body is a machine.']
            },
            {
                prompt: 'Why did you come to somewhere?',
                truth: 'Because some part of you already knew the answer and needed the void to say it back.',
                lies: ['Curiosity. That is always safe.', 'You were sent by someone who has never been here.']
            },
            {
                prompt: 'What is The First Spark, really?',
                truth: 'A fracture that refused to stay closed — turned into infrastructure for anyone still inside one.',
                lies: ['A brand built for investors.', 'A metaphor with good typography.']
            },
            {
                prompt: 'What does the Sparkverse hold?',
                truth: 'Tools, maps, rituals, and people building a language for what they already feel but cannot name.',
                lies: ['Content. Subscription tiers. Exit strategy.', 'Only games for people who believe in astrology.']
            },
            {
                prompt: 'What happens if you guess wrong?',
                truth: 'The void folds that version of you shut for a breath — and you descend anyway, lighter or heavier, your choice.',
                lies: ['You are locked out forever.', 'Nothing. There are no consequences in places that do not exist.']
            },
            {
                prompt: 'Where is somewhere on a map?',
                truth: 'Nowhere coordinates can reach — which is why only the lost and the deliberate find it.',
                lies: ['Ohio. Always Ohio.', 'Exactly halfway between hope and habit.']
            },
            {
                prompt: 'What is money to the one who built this?',
                truth: 'Fuel sent back out — builders paid, land healed, tools free where they need to be free.',
                lies: ['The only score that matters.', 'A necessary evil she has made peace with hoarding.']
            },
            {
                prompt: 'What is a Soul Map?',
                truth: 'Your numbers and stars translated into a page that reads like someone finally saw the pattern you were living.',
                lies: ['A personality quiz with better fonts.', 'Data harvested for a funnel you cannot see.']
            },
            {
                prompt: 'Who is allowed to work here?',
                truth: 'Anyone whose signal matches — affiliates, builders, skeptics who ship, believers who doubt out loud.',
                lies: ['Only those who have already paid.', 'Only the founder. Always only the founder.']
            },
            {
                prompt: 'What is the Selector Model?',
                truth: 'A framework: reality is programmable, consciousness is the code, and you can learn to read what runs underneath.',
                lies: ['A philosophy degree compressed into jargon.', 'Copyrighted language with no application.']
            },
            {
                prompt: 'What sits at the bottom of the scroll?',
                truth: 'Not an ending — a mirror polished by every truth you chose correctly.',
                lies: ['A sales page disguised as mysticism.', 'The same place you started, but upside down.']
            },
            {
                prompt: 'What is the Earthship dream?',
                truth: 'Land in Hocking Hills where the digital signal becomes soil — off-grid, reciprocal, built to outlast greed.',
                lies: ['A real estate play with crystals.', 'A metaphor she will never actually build.']
            },
            {
                prompt: 'What did 2020 leave behind?',
                truth: 'A solved cold case, an awakening, and a woman who decided the rest of her life would be code for healing.',
                lies: ['Trauma content for a podcast.', 'A clean slate with no baggage attached.']
            },
            {
                prompt: 'What is the Collapse Protocol?',
                truth: 'Training the observer effect — learning to select outcomes from possibility without forcing the universe to flinch.',
                lies: ['Manifestation with a science lab coat.', 'A game that does nothing when you close the tab.']
            },
            {
                prompt: 'Why two lies and not one?',
                truth: 'Because a single falsehood is easy to spot — but two plausible ones split your certainty and reveal what you worship.',
                lies: ['Because the void is cruel.', 'Because three options look better in UI design.']
            },
            {
                prompt: 'What does the void want from you?',
                truth: 'Discernment — the willingness to feel which sentence rings like a bell and which ones merely echo.',
                lies: ['Submission.', 'Your email address. It always comes back to that.']
            },
            {
                prompt: 'Can you invest in somewhere?',
                truth: 'You can invest in the timeline it opens into — $200K SAFE, zero burn, tools live, money meant to circulate back into the world.',
                lies: ['Only if you know the founder personally.', 'No. Somewhere has no relationship to the physical economy.']
            },
            {
                prompt: 'What is Book Zero?',
                truth: 'The memoir still being written — from a murder solved to a platform built, mile by mile, in public.',
                lies: ['A prequel to the novel. Nothing more.', 'Marketing copy for a tour that will never leave the driveway.']
            },
            {
                prompt: 'What happens when you touch the void?',
                truth: 'It answers — not with comfort, with triangulation. You learn what you are willing to believe.',
                lies: ['Nothing. It is decorative.', 'It tracks your cursor for retargeting ads.']
            },
            {
                prompt: 'Is somewhere real?',
                truth: 'As real as any place that only exists when you stop insisting you already know where you are.',
                lies: ['No. It is a web page.', 'Yes. It has a ZIP code and business hours.']
            }
        ];

        function shuffle(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }

        /* ─── STATE ─── */
        var touchZone = document.getElementById('touch-zone');
        var oracle = document.getElementById('oracle');
        var choicesEl = document.getElementById('choices');
        var promptEl = document.getElementById('oracle-prompt');
        var kickerEl = document.getElementById('oracle-kicker');
        var resultEl = document.getElementById('oracle-result');
        var closeBtn = document.getElementById('oracle-close');
        var streakEl = document.getElementById('streak');
        var floorText = document.getElementById('floor-text');

        var correct = parseInt(localStorage.getItem('somewhere_correct') || '0', 10);
        var wrong = parseInt(localStorage.getItem('somewhere_wrong') || '0', 10);
        var used = JSON.parse(localStorage.getItem('somewhere_used') || '[]');
        var open = false;
        var current = null;

        function updateStreak() {
            if (correct + wrong === 0) {
                streakEl.textContent = '';
                return;
            }
            streakEl.textContent = correct + ' true · ' + wrong + ' wrong';
        }
        updateStreak();

        function pickOracle() {
            var pool = oracles.filter(function (_, i) { return used.indexOf(i) === -1; });
            if (pool.length === 0) {
                used = [];
                pool = oracles.slice();
            }
            var item = pool[Math.floor(Math.random() * pool.length)];
            var idx = oracles.indexOf(item);
            used.push(idx);
            localStorage.setItem('somewhere_used', JSON.stringify(used));
            return item;
        }

        function ripple(x, y) {
            var el = document.createElement('div');
            el.className = 'ripple';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 1200);
        }

        function openOracle(x, y) {
            if (open) return;
            open = true;
            current = pickOracle();
            ripple(x, y);

            document.body.classList.add('guessing');
            oracle.classList.remove('wrong-state');
            resultEl.classList.remove('show', 'good', 'bad');
            resultEl.textContent = '';
            closeBtn.style.display = 'block';
            kickerEl.textContent = 'The void speaks';
            promptEl.textContent = current.prompt;
            choicesEl.innerHTML = '';

            var options = shuffle([
                { text: current.truth, isTruth: true },
                { text: current.lies[0], isTruth: false },
                { text: current.lies[1], isTruth: false }
            ]);

            options.forEach(function (opt, i) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'choice';
                btn.textContent = opt.text;
                btn.dataset.truth = opt.isTruth ? '1' : '0';
                btn.addEventListener('click', function () { resolve(btn); });
                choicesEl.appendChild(btn);
            });

            oracle.classList.add('open');
        }

        function resolve(btn) {
            var buttons = choicesEl.querySelectorAll('.choice');
            buttons.forEach(function (b) { b.disabled = true; });

            var isTruth = btn.dataset.truth === '1';

            buttons.forEach(function (b) {
                if (b.dataset.truth === '1') b.classList.add('correct');
                else if (b === btn && !isTruth) b.classList.add('incorrect');
                else if (b !== btn) b.style.opacity = '0.35';
            });

            if (isTruth) {
                correct++;
                localStorage.setItem('somewhere_correct', correct);
                resultEl.textContent = 'The void opens. You may descend further.';
                resultEl.className = 'oracle-result show good';
                kickerEl.textContent = 'True';
            } else {
                wrong++;
                localStorage.setItem('somewhere_wrong', wrong);
                oracle.classList.add('wrong-state');
                document.body.classList.add('wrong');
                setTimeout(function () { document.body.classList.remove('wrong'); }, 600);
                resultEl.textContent = 'Wrong. The fold remembers. Touch again when you are ready to listen closer.';
                resultEl.className = 'oracle-result show bad';
                kickerEl.textContent = 'Folded';
            }

            updateStreak();
            closeBtn.textContent = isTruth ? 'descend' : 'dissolve';

            if (correct >= 7) {
                floorText.textContent = 'The floor is not a floor anymore. You have heard the void often enough — it considers you a resident of somewhere.';
            } else if (wrong >= 5) {
                floorText.textContent = 'The floor feels further than before. Wrong guesses add weight. The void is patient, but not infinite.';
            }
        }

        function closeOracle() {
            oracle.classList.remove('open', 'wrong-state');
            open = false;
            document.body.classList.remove('guessing');
            closeBtn.textContent = 'dissolve';
        }

        touchZone.addEventListener('click', function (e) {
            openOracle(e.clientX, e.clientY);
        });

        touchZone.addEventListener('touchstart', function (e) {
            if (e.touches.length) {
                e.preventDefault();
                var t = e.touches[0];
                openOracle(t.clientX, t.clientY);
            }
        }, { passive: false });

        closeBtn.addEventListener('click', closeOracle);

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && open) closeOracle();
        });
    })();
    </script>
</body>
</html>
