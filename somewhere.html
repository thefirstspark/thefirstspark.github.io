<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <title>Somewhere</title>
    <meta name="description" content="Neither here nor there. Descend. Touch nothing you trust. Find what was left for you.">
    <meta property="og:title" content="Somewhere">
    <meta property="og:description" content="A place between coordinates. Cryptic clues in the void.">
    <meta property="og:url" content="https://thefirstspark.shop/somewhere.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --void: #030308;
            --glow: #a8f0d8;
            --violet: #9a7ec8;
            --gold: #c9a85c;
            --ember: #c46a7a;
            --dim: rgba(210, 205, 235, 0.35);
            --text: rgba(235, 230, 255, 0.82);
        }

        html { scroll-behavior: auto; }

        body {
            background: var(--void);
            color: var(--text);
            font-family: 'Cormorant Garamond', Georgia, serif;
            overflow-x: hidden;
            cursor: crosshair;
        }

        #void-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .fog {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 100% 55% at 50% 110%, rgba(50, 35, 90, 0.2), transparent 65%),
                radial-gradient(ellipse 70% 45% at 15% 25%, rgba(25, 55, 85, 0.07), transparent 55%),
                radial-gradient(ellipse 55% 40% at 88% 55%, rgba(80, 45, 75, 0.06), transparent 50%);
        }

        /* cursor halo */
        #halo {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(168, 240, 216, 0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity .4s;
        }
        body.in-void #halo { opacity: 1; }

        .entry {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 28px;
        }

        .entry h1 {
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 400;
            font-style: italic;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.1);
            animation: breathe 9s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.45; letter-spacing: 0.1em; }
            50% { opacity: 0.9; letter-spacing: 0.16em; }
        }

        .entry .coords {
            margin-top: 28px;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.28em;
            color: rgba(168, 240, 216, 0.25);
        }

        .entry .sub {
            margin-top: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--dim);
            line-height: 2.2;
        }

        .scroll-glyph {
            margin-top: 64px;
            font-size: 0.5rem;
            letter-spacing: 0.4em;
            color: rgba(255,255,255,0.12);
            font-family: 'Space Mono', monospace;
            animation: drift 3.5s ease-in-out infinite;
        }
        @keyframes drift {
            50% { transform: translateY(8px); opacity: 0.5; }
        }

        /* ─── ABYSS ─── */
        #abyss {
            position: relative;
            z-index: 2;
            min-height: 500vh;
        }

        #touch-zone {
            position: absolute;
            inset: 0;
            z-index: 3;
        }

        /* hidden glyphs — only visible near cursor or when found */
        .glyph {
            position: absolute;
            font-family: 'Space Mono', monospace;
            font-size: 0.48rem;
            letter-spacing: 0.22em;
            color: rgba(255,255,255,0.04);
            pointer-events: none;
            user-select: none;
            transition: color .6s, text-shadow .6s;
            white-space: nowrap;
        }
        .glyph.near {
            color: rgba(168, 240, 216, 0.35);
            text-shadow: 0 0 20px rgba(168, 240, 216, 0.2);
        }
        .glyph.found {
            color: rgba(201, 168, 92, 0.55);
            text-shadow: 0 0 24px rgba(201, 168, 92, 0.25);
        }

        .rift {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(154, 126, 200, 0.15), transparent);
            pointer-events: none;
        }

        .static-verse {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-style: italic;
            font-size: clamp(0.95rem, 2.2vw, 1.2rem);
            color: rgba(200, 190, 230, 0.12);
            max-width: 280px;
            line-height: 1.7;
            pointer-events: none;
            user-select: none;
        }

        /* touch burst clue */
        .burst {
            position: fixed;
            z-index: 20;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            max-width: 260px;
            animation: burstLife 4.5s ease forwards;
        }
        @keyframes burstLife {
            0% { opacity: 0; filter: blur(8px); transform: translate(-50%, -50%) scale(0.85); }
            12% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 0.7; }
            100% { opacity: 0; filter: blur(6px); transform: translate(-50%, -70%) scale(1.02); }
        }
        .burst .tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.42rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(154, 126, 200, 0.6);
            margin-bottom: 10px;
        }
        .burst .line {
            font-size: 1.05rem;
            font-style: italic;
            line-height: 1.55;
            color: rgba(235, 230, 255, 0.75);
        }
        .burst .cipher {
            margin-top: 12px;
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.18em;
            color: rgba(168, 240, 216, 0.45);
        }

        .ripple {
            position: fixed;
            z-index: 4;
            border-radius: 50%;
            border: 1px solid rgba(168, 240, 216, 0.25);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleOut 1.4s ease-out forwards;
        }
        @keyframes rippleOut {
            from { width: 0; height: 0; opacity: 0.7; margin: 0; }
            to { width: 160px; height: 160px; opacity: 0; margin: -80px 0 0 -80px; }
        }

        /* secret panel — assembled from found glyphs */
        #cache {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 30;
            font-family: 'Space Mono', monospace;
            font-size: 0.42rem;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.08);
            max-width: 200px;
            line-height: 1.9;
            pointer-events: none;
            transition: color .5s;
        }
        #cache.warm { color: rgba(201, 168, 92, 0.35); }
        #cache.hot {
            color: rgba(168, 240, 216, 0.55);
            text-shadow: 0 0 16px rgba(168, 240, 216, 0.15);
        }

        /* depth-locked secrets */
        .seal {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.4em;
            color: transparent;
            border: 1px solid transparent;
            padding: 14px 22px;
            cursor: pointer;
            transition: color 1s, border-color 1s, box-shadow 1s;
            z-index: 4;
        }
        .seal.revealed {
            color: rgba(196, 106, 122, 0.5);
            border-color: rgba(196, 106, 122, 0.2);
            box-shadow: 0 0 40px rgba(196, 106, 122, 0.08);
        }
        .seal.open {
            color: var(--gold);
            border-color: rgba(201, 168, 92, 0.35);
            letter-spacing: 0.2em;
        }

        .floor {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 28px;
        }
        .floor .final {
            font-size: 1.25rem;
            font-style: italic;
            color: rgba(255,255,255,0.15);
            max-width: 360px;
            line-height: 1.85;
            min-height: 3em;
        }
        .floor a {
            margin-top: 48px;
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(201, 168, 92, 0.25);
            text-decoration: none;
            transition: color .3s;
        }
        .floor a:hover { color: var(--gold); }

        .floor .hidden-door {
            margin-top: 24px;
            font-family: 'Space Mono', monospace;
            font-size: 0.45rem;
            letter-spacing: 0.2em;
            color: transparent;
            text-decoration: none;
            transition: color 1.2s;
        }
        .floor .hidden-door.show {
            color: rgba(168, 240, 216, 0.4);
        }
        .floor .hidden-door.show:hover { color: var(--glow); }

        /* konami flicker */
        .signal-flash {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(168, 240, 216, 0.03);
            pointer-events: none;
            opacity: 0;
            animation: flash .3s ease;
        }
        @keyframes flash {
            50% { opacity: 1; }
        }
    </style>

<body>
    <canvas id="void-canvas" aria-hidden="true"></canvas>
    <div class="fog" aria-hidden="true"></div>
    <div id="halo" aria-hidden="true"></div>
    <div id="cache" aria-live="polite"></div>

    <header class="entry">
        <h1>Somewhere</h1>
        <p class="coords" id="live-coords">???° ???' — · — ???° ???'</p>
        <p class="sub">neither here<br>nor there</p>
        <p class="scroll-glyph">descend ↓ · touch the dark</p>
    </header>

    <section id="abyss" aria-label="The void">
        <div id="touch-zone"></div>
    </section>

    <footer class="floor">
        <p class="final" id="final-verse">the floor is not ground. it is a door pretending to be tired.</p>
        <a href="/" class="exit">↑ return to here</a>
        <a href="/source" class="hidden-door" id="hidden-door">chamber protocol detected →</a>
    </footer>

    <script>
    (function () {
        'use strict';

        /* ─── particles ─── */
        var canvas = document.getElementById('void-canvas');
        var ctx = canvas.getContext('2d');
        var motes = [], W, H, scrollY = 0, mouse = { x: -999, y: -999 };

        function resize() {
            W = canvas.width = innerWidth;
            H = canvas.height = innerHeight;
            motes = [];
            var n = Math.min(200, Math.floor(W * H / 5500));
            for (var i = 0; i < n; i++) {
                motes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.3 + 0.2,
                    vx: (Math.random() - 0.5) * 0.12,
                    vy: Math.random() * 0.2 + 0.04,
                    p: Math.random() * 6.28,
                    t: Math.floor(Math.random() * 3)
                });
            }
        }

        function draw() {
            scrollY = scrollY;
            ctx.fillStyle = 'rgba(3,3,8,0.2)';
            ctx.fillRect(0, 0, W, H);
            motes.forEach(function (m) {
                m.x += m.vx + Math.sin(m.p) * 0.06;
                m.y += m.vy;
                m.p += 0.01;
                if (m.x < 0) m.x = W;
                if (m.x > W) m.x = 0;
                if (m.y > H) { m.y = 0; m.x = Math.random() * W; }
                var dx = m.x - mouse.x, dy = m.y - mouse.y;
                var near = dx * dx + dy * dy < 14000;
                var a = (near ? 0.55 : 0.2) * (0.5 + 0.5 * Math.sin(m.p));
                ctx.beginPath();
                ctx.arc(m.x, m.y, near ? m.r * 1.6 : m.r, 0, 6.28);
                var cols = ['rgba(168,240,216,', 'rgba(154,126,200,', 'rgba(201,168,92,'];
                ctx.fillStyle = cols[m.t] + a + ')';
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        resize(); draw();
        addEventListener('resize', resize);

        document.addEventListener('mousemove', function (e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            var halo = document.getElementById('halo');
            halo.style.left = e.clientX + 'px';
            halo.style.top = e.clientY + 'px';
        });

        /* ─── live fake coordinates from scroll ─── */
        var coordsEl = document.getElementById('live-coords');
        function updateCoords() {
            var d = scrollY / (document.body.scrollHeight - innerHeight);
            var lat = (41.08 + Math.sin(d * 8.4) * 0.31).toFixed(2);
            var lng = (-81.52 + Math.cos(d * 5.7) * 0.44).toFixed(2);
            var alt = Math.floor(d * 9999);
            coordsEl.textContent = lat + '° ' + alt + "' — · — " + lng + '° ???′';
        }

        /* ─── hidden glyphs in the void ─── */
        var abyss = document.getElementById('abyss');
        var glyphs = [
            { t: 'S-0', top: 6, left: 12 },
            { t: 'ELECT', top: 11, left: 78 },
            { t: '41.081', top: 18, left: 8 },
            { t: 'RACHAEL', top: 22, left: 70 },
            { t: '◈ 519', top: 28, left: 22 },
            { t: 'COLLAPSE', top: 34, left: 65 },
            { t: '29Y', top: 40, left: 15 },
            { t: 'FOLD·PT', top: 46, left: 72 },
            { t: 'KJP', top: 52, left: 10 },
            { t: 'LINEAGE', top: 58, left: 68 },
            { t: '2020', top: 64, left: 18 },
            { t: 'PATTERN', top: 70, left: 75 },
            { t: 'RV·STUDIO', top: 76, left: 14 },
            { t: 'HOCKING', top: 82, left: 62 },
            { t: 'SPARK', top: 88, left: 20 }
        ];
        var foundGlyphs = JSON.parse(localStorage.getItem('somewhere_found') || '[]');
        var glyphEls = [];

        glyphs.forEach(function (g, i) {
            var el = document.createElement('div');
            el.className = 'glyph' + (foundGlyphs.indexOf(i) !== -1 ? ' found' : '');
            el.style.top = g.top + '%';
            el.style.left = g.left + '%';
            el.textContent = g.t;
            el.dataset.i = i;
            abyss.appendChild(el);
            glyphEls.push(el);
        });

        /* static verses at depths */
        var verses = [
            { top: 8, text: 'maps end where willingness begins' },
            { top: 20, text: 'the killer was closer than the story allowed' },
            { top: 33, text: 'consciousness compiles in the dark' },
            { top: 48, text: 'you are not lost. you are unlabeled.' },
            { top: 61, text: 'reciprocity is the only stable orbit' },
            { top: 74, text: 'the earthship is not a metaphor. look up Hocking Hills.' },
            { top: 86, text: 'somewhere keeps what here forgets' }
        ];
        verses.forEach(function (v) {
            var el = document.createElement('p');
            el.className = 'static-verse';
            el.style.top = v.top + '%';
            el.textContent = v.text;
            abyss.appendChild(el);
        });

        /* vertical rift */
        var rift = document.createElement('div');
        rift.className = 'rift';
        rift.style.top = '5%';
        rift.style.height = '90%';
        abyss.appendChild(rift);

        /* depth seal — triple click when scroll > 75% */
        var seal = document.createElement('button');
        seal.className = 'seal';
        seal.style.top = '78%';
        seal.textContent = '···';
        seal.setAttribute('aria-label', 'sealed coordinate');
        abyss.appendChild(seal);
        var sealClicks = 0;
        var sealOpen = localStorage.getItem('somewhere_seal') === '1';

        if (sealOpen) {
            seal.className = 'seal open';
            seal.textContent = 'WHOP·SPARK·ACCESS';
        }

        seal.addEventListener('click', function () {
            var depth = scrollY / (document.body.scrollHeight - innerHeight);
            if (depth < 0.62) {
                spawnBurst(innerWidth / 2, innerHeight / 2, 'depth', 'not deep enough.', 'descend further');
                return;
            }
            sealClicks++;
            seal.classList.add('revealed');
            if (sealClicks >= 3) {
                seal.className = 'seal open';
                seal.textContent = 'WHOP·SPARK·ACCESS';
                localStorage.setItem('somewhere_seal', '1');
                document.getElementById('hidden-door').classList.add('show');
                spawnBurst(innerWidth / 2, innerHeight * 0.7, 'unsealed', 'the lobby was always free.', 'sparkverse-511c');
            }
        });

        /* ─── touch clues pool ─── */
        var clues = [
            { tag: 'fragment', line: 'the first spark was not inspiration. it was refusal.', cipher: '41.081 · -81.519 · akron' },
            { tag: 'signal', line: 'your life path is not random. it is running.', cipher: 'LP + EP + SU + PY' },
            { tag: 'echo', line: 'she solved what the system could not.', cipher: 'ID · two fires · 2020' },
            { tag: 'void-note', line: 'four chambers. one operating system.', cipher: '/source → /collapse first' },
            { tag: 'drift', line: 'money that does not circulate rots.', cipher: 'pump · back · out' },
            { tag: 'static', line: 'the map updates for twelve moons.', cipher: '$22 · OG · edition' },
            { tag: 'fold', line: 'timelines branch at the moment you almost quit.', cipher: 'fold·point·logger' },
            { tag: 'blood', line: 'inherited code can be debugged.', cipher: 'chamber 4 · lineage' },
            { tag: 'geometry', line: 'see the pattern before thought arrives.', cipher: '8 core · sacred · shapes' },
            { tag: 'rig', line: 'solar on roof. starlink on dash. chapters from the road.', cipher: 'book·zero·tour' },
            { tag: 'selector', line: 'reality is programmable. you are the runtime.', cipher: 'SELECT · RELEASE · WITNESS' },
            { tag: 'whisper', line: 'somewhere is where the coordinate failed.', cipher: 'null · island · ∞' },
            { tag: 'affiliate', line: 'share the map. keep thirty-five percent.', cipher: 'real·to·real·signal' },
            { tag: 'invest', line: 'two hundred K. zero burn. story unmatched.', cipher: 'SAFE · earthship · AI' },
            { tag: 'genesis', line: 'the novel came before the platform had a name.', cipher: '75K words · lineage layer' },
            { tag: 'glitch', line: 'player one was never a username. it was a diagnosis.', cipher: 'OG · spark · 519' },
            { tag: 'frequency', line: 'you were broadcasting before you had language.', cipher: 'see·your·frequency' },
            { tag: 'wall', line: 'leave a mark where rules dissolve.', cipher: 'graffiti · deluxe · void' },
            { tag: 'reset', line: 'five minutes in the morning rewires the day.', cipher: '1,243+ · completed' },
            { tag: 'cipher', line: 'the answer is not hidden. it is unchosen.', cipher: '◈ ◈ ◈' }
        ];
        var clueIdx = parseInt(localStorage.getItem('somewhere_clue_idx') || '0', 10);
        var touchCount = parseInt(localStorage.getItem('somewhere_touches') || '0', 10);

        function spawnBurst(x, y, tag, line, cipher) {
            var el = document.createElement('div');
            el.className = 'burst';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerHTML = '<div class="tag">' + tag + '</div><div class="line">' + line + '</div>' +
                (cipher ? '<div class="cipher">' + cipher + '</div>' : '');
            document.body.appendChild(el);
            setTimeout(function () { el.remove(); }, 4500);
        }

        function ripple(x, y) {
            var r = document.createElement('div');
            r.className = 'ripple';
            r.style.left = x + 'px';
            r.style.top = y + 'px';
            document.body.appendChild(r);
            setTimeout(function () { r.remove(); }, 1400);
        }

        function nearGlyph(x, y) {
            var rect = abyss.getBoundingClientRect();
            var relX = ((x - rect.left) / rect.width) * 100;
            var relY = ((y - rect.top + scrollY) / abyss.offsetHeight) * 100;
            var hit = false;
            glyphEls.forEach(function (el, i) {
                var g = glyphs[i];
                var dx = relX - g.left, dy = relY - g.top;
                if (dx * dx + dy * dy < 36) {
                    if (foundGlyphs.indexOf(i) === -1) {
                        foundGlyphs.push(i);
                        localStorage.setItem('somewhere_found', JSON.stringify(foundGlyphs));
                        el.classList.add('found');
                        spawnBurst(x, y, 'recovered', 'signal fragment archived.', g.t);
                        hit = true;
                    }
                }
            });
            updateCache();
            return hit;
        }

        function updateCache() {
            var cache = document.getElementById('cache');
            var n = foundGlyphs.length;
            if (n === 0) {
                cache.textContent = 'cache: empty';
                cache.className = '';
            } else if (n < 8) {
                cache.textContent = 'cache: ' + n + '/' + glyphs.length + ' fragments';
                cache.className = 'warm';
            } else if (n < glyphs.length) {
                cache.textContent = 'cache: ' + n + '/' + glyphs.length + ' — pattern forming';
                cache.className = 'warm';
            } else {
                cache.textContent = 'cache: FULL · S·E·L·E·C·T unlocked';
                cache.className = 'hot';
                document.getElementById('hidden-door').classList.add('show');
                document.getElementById('final-verse').textContent =
                    'you mapped somewhere without a map. the void considers that sufficient.';
            }
        }
        updateCache();
        if (localStorage.getItem('somewhere_seal') === '1') {
            document.getElementById('hidden-door').classList.add('show');
        }

        function onTouch(x, y) {
            ripple(x, y);
            touchCount++;
            localStorage.setItem('somewhere_touches', touchCount);

            if (!nearGlyph(x, y)) {
                var c = clues[clueIdx % clues.length];
                clueIdx++;
                localStorage.setItem('somewhere_clue_idx', clueIdx);
                spawnBurst(x, y, c.tag, c.line, c.cipher);
            }

            if (touchCount === 7) {
                setTimeout(function () {
                    spawnBurst(innerWidth / 2, innerHeight * 0.4, 'void', 'seven touches. the void knows your rhythm now.', 'keep going');
                }, 800);
            }
        }

        document.getElementById('touch-zone').addEventListener('click', function (e) {
            onTouch(e.clientX, e.clientY);
        });
        document.getElementById('touch-zone').addEventListener('touchstart', function (e) {
            if (e.touches[0]) {
                e.preventDefault();
                onTouch(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        /* glyph proximity on scroll */
        function checkGlyphProximity() {
            var rect = abyss.getBoundingClientRect();
            glyphEls.forEach(function (el, i) {
                var g = glyphs[i];
                var gx = rect.left + (g.left / 100) * rect.width;
                var gy = rect.top + (g.top / 100) * rect.height;
                var dx = mouse.x - gx, dy = mouse.y - gy;
                el.classList.toggle('near', dx * dx + dy * dy < 18000 && gy > 0 && gy < innerHeight);
            });
        }

        /* scroll depth secrets */
        var depthSecrets = [
            { at: 0.15, msg: 'something watches at 15% depth' },
            { at: 0.42, msg: 'the between is loudest at 42' },
            { at: 0.66, msg: 'ancestral code runs below 66' },
            { at: 0.91, msg: 'floor is a lie. door is real.' }
        ];
        var fired = JSON.parse(localStorage.getItem('somewhere_depth') || '[]');

        addEventListener('scroll', function () {
            scrollY = scrollY;
            updateCoords();
            checkGlyphProximity();
            document.body.classList.toggle('in-void', scrollY > innerHeight * 0.4);

            var depth = scrollY / Math.max(1, document.body.scrollHeight - innerHeight);
            depthSecrets.forEach(function (s, i) {
                if (depth >= s.at && fired.indexOf(i) === -1) {
                    fired.push(i);
                    localStorage.setItem('somewhere_depth', JSON.stringify(fired));
                    var cache = document.getElementById('cache');
                    var prev = cache.textContent;
                    cache.textContent = '⌁ ' + s.msg;
                    cache.className = 'warm';
                    setTimeout(function () { updateCache(); }, 4000);
                }
            });
        }, { passive: true });

        /* idle secret — type SOMETHING */
        var typed = '';
        var target = 'somewhere';
        document.addEventListener('keydown', function (e) {
            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed === target) {
                    var f = document.createElement('div');
                    f.className = 'signal-flash';
                    document.body.appendChild(f);
                    setTimeout(function () { f.remove(); }, 300);
                    spawnBurst(innerWidth / 2, innerHeight / 2, 'keyed', 'you named the place. it answers.', 'neither·here·nor·there·both');
                    typed = '';
                }
            }
        });

        updateCoords();
    })();
    </script>
</body>
